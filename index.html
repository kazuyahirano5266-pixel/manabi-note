<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム</title>

<style>
body{
  font-family:"Hiragino Kaku Gothic ProN",sans-serif;
  background:#f0f8ff;
  text-align:center;
  padding:20px;
}

h1{
  color:#2b7a78;
}

.box{
  background:white;
  border-radius:20px;
  padding:20px;
  margin:20px auto;
  max-width:500px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input,textarea{
  width:90%;
  padding:12px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #aaa;
}

button{
  margin-top:20px;
  padding:15px 40px;
  font-size:20px;
  border:none;
  border-radius:30px;
  background:#2b7a78;
  color:white;
}

#msg{
  color:#2b7a78;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>📚 学びアルバム</h1>

<p>🌱 なまえ</p>
<input type="text" id="name">

<p>✨ 今日の学び</p>
<textarea id="study" rows="5"></textarea>

<p>🚀 次にやりたいこと</p>
<textarea id="next" rows="4"></textarea>

<br>

<button onclick="save()">保存する</button>

<p id="msg"></p>

</div>


<script>

function save(){

const data={
name:document.getElementById("name").value,
study:document.getElementById("study").value,
next:document.getElementById("next").value
};

localStorage.setItem("manabi",JSON.stringify(data));

document.getElementById("msg").innerHTML="🌟 保存しました！";

}

</script>
<br>

<a href="teacher.html">
<button>👩‍🏫 先生ページ</button>
</a>
</body>
</html>
