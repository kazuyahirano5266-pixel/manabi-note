<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム</title>

<style>
body{
font-family:"Hiragino Kaku Gothic ProN",sans-serif;
background:#f0f8ff;
text-align:center;
padding:20px;
}

.box{
background:white;
border-radius:20px;
padding:20px;
max-width:500px;
margin:auto;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
color:#2b7a78;
}

input,textarea{
width:90%;
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #aaa;
}

button{
margin-top:20px;
padding:15px 40px;
font-size:20px;
border:none;
border-radius:30px;
background:#2b7a78;
color:white;
}

#msg{
color:#2b7a78;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>📚 学びアルバム</h1>

<p>🌱 なまえ</p>
<input type="text" id="name">

<p>✨ 今日の学び</p>
<textarea id="study" rows="5"></textarea>

<p>🚀 次にやりたいこと</p>
<textarea id="next" rows="4"></textarea>

<button onclick="save()">保存する</button>

<p id="msg"></p>

<br>

<a href="teacher.html">
<button>👩‍🏫 先生ページ</button>
</a>

</div>


<script>

function save(){

const newData={
name:document.getElementById("name").value,
study:document.getElementById("study").value,
next:document.getElementById("next").value
};


let list=JSON.parse(localStorage.getItem("manabiList")) || [];


list.push(newData);


localStorage.setItem("manabiList",JSON.stringify(list));


document.getElementById("msg").innerHTML=
"🌟 保存しました！";


document.getElementById("name").value="";
document.getElementById("study").value="";
document.getElementById("next").value="";

}

</script>

</body>
</html>
