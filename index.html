<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム</title>

<style>
body{
font-family:"Hiragino Kaku Gothic ProN",sans-serif;
background:#f0f8ff;
text-align:center;
padding:20px;
}

.box{
background:white;
border-radius:20px;
padding:20px;
max-width:500px;
margin:auto;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
color:#2b7a78;
}

input,textarea{
width:90%;
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #aaa;
}

button{
margin-top:20px;
padding:15px 40px;
font-size:20px;
border:none;
border-radius:30px;
background:#2b7a78;
color:white;
}

#msg{
color:#2b7a78;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>📚 学びアルバム</h1>

<p>🌱 なまえ</p>
<input type="text" id="name">
<p>📚 教科を選ぶ</p>

<select id="subject">
<option value="生活">生活</option>
<option value="国語">国語</option>
<option value="算数">算数</option>
<option value="理科">理科</option>
<option value="社会">社会</option>
<option value="道徳">道徳</option>
<option value="体育">体育</option>
</select>
<p>✨ 今日の学び</p>
<textarea id="study" rows="5"></textarea>

<p>🚀 次にやりたいこと</p>
<textarea id="next" rows="4"></textarea>

<button onclick="save()">保存する</button>
<br>

<button onclick="advice()">
🤖 学びアドバイス
</button>

<p id="ai"></p>
<p id="msg"></p>

<br>

<a href="teacher.html">
<button>👩‍🏫 先生ページ</button>
</a>

</div>


<script>

function save(){

const newData={
name:document.getElementById("name").value,
subject:document.getElementById("subject").value,
study:document.getElementById("study").value,
next:document.getElementById("next").value
};


let list=JSON.parse(localStorage.getItem("manabiList")) || [];


list.push(newData);


localStorage.setItem("manabiList",JSON.stringify(list));


document.getElementById("msg").innerHTML=
"🌟 保存しました！";


document.getElementById("name").value="";
document.getElementById("study").value="";
document.getElementById("next").value="";

}
function advice(){

const subject =
document.getElementById("subject").value;

let message="";


if(subject==="国語"){

message="📖 文章のどの言葉や表現からそう考えたのか、理由を見つけて説明してみましょう。";

}else if(subject==="算数"){

message="➕ 答えだけでなく、どのように考えたのかを図や言葉で説明してみましょう。";

}else if(subject==="生活"){

message="🌱 見つけたことや気付いたことを、相手に分かりやすく伝える方法を考えてみましょう。";

}else if(subject==="理科"){

message="🔬 予想と結果を比べて、なぜそうなったのか理由を考えてみましょう。";

}else if(subject==="社会"){

message="🌏 資料や人の話をもとに、根拠をもって考えを伝えてみましょう。";

}else if(subject==="道徳"){

message="💚 自分の考えだけでなく、相手の立場からも考えてみましょう。";

}else if(subject==="体育"){

message="🏃 できたことや工夫したことを振り返り、次の挑戦につなげてみましょう。";

}


document.getElementById("ai").innerHTML=
"🤖 "+message;

}
</script>

</body>
</html>
