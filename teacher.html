<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>先生ページ</title>

<style>
body{
font-family:"Hiragino Kaku Gothic ProN",sans-serif;
background:#fff8e7;
text-align:center;
padding:20px;
}

.box{
background:white;
border-radius:20px;
padding:20px;
max-width:500px;
margin:auto;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
color:#d2691e;
}

button{
padding:15px 30px;
font-size:18px;
border-radius:20px;
border:none;
background:#d2691e;
color:white;
}

#result{
margin-top:20px;
text-align:left;
}
</style>

</head>

<body>

<div class="box">

<h1>👩‍🏫 先生ページ</h1>

<p>児童の学びを確認します</p>

<button onclick="show()">記録を見る</button>

<div id="result"></div>

</div>


<script>

function show(){

const data=JSON.parse(localStorage.getItem("manabi"));

if(data){

document.getElementById("result").innerHTML=
"👤名前："+data.name+
"<br><br>✨今日の学び："+data.study+
"<br><br>🚀次にやりたいこと："+data.next;

}else{

document.getElementById("result").innerHTML=
"まだ記録がありません";

}

}

</script>

</body>
</html>
