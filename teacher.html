<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>先生ページ</title>

<style>
body{
font-family:"Hiragino Kaku Gothic ProN",sans-serif;
background:#fff8e7;
text-align:center;
padding:20px;
}

.box{
background:white;
border-radius:20px;
padding:20px;
max-width:600px;
margin:auto;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
color:#d2691e;
}

.card{
border:2px solid #ddd;
border-radius:15px;
padding:15px;
margin:15px 0;
text-align:left;
}

textarea{
width:90%;
padding:10px;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 25px;
font-size:18px;
border-radius:20px;
border:none;
background:#d2691e;
color:white;
margin-top:10px;
}
</style>

</head>

<body>

<div class="box">

<h1>👩‍🏫 先生ページ</h1>

<p>児童の学び一覧</p>

<button onclick="show()">一覧を見る</button>

<div id="result"></div>

</div>


<script>

function show(){

const data=JSON.parse(localStorage.getItem("manabiList")) || [];

let html="";

if(data.length===0){

html="まだ記録がありません";

}else{

data.forEach(function(item,index){

html += `
<div class="card">

👤 ${item.name}<br><br>

✨ 今日の学び<br>
${item.study}<br><br>

🚀 次にやりたいこと<br>
${item.next}<br><br>

💬 先生コメント<br>

<textarea id="comment${index}" rows="3">${item.comment || ""}</textarea>

<br>

<button onclick="saveComment(${index})">
コメント保存
</button>

</div>
`;

});

}

document.getElementById("result").innerHTML=html;

}


function saveComment(index){

let data=JSON.parse(localStorage.getItem("manabiList")) || [];

data[index].comment=
document.getElementById("comment"+index).value;


localStorage.setItem("manabiList",JSON.stringify(data));


alert("コメントを保存しました！");

}

</script>

</body>
</html>
